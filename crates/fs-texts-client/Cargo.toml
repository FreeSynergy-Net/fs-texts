[package]
name = "fs-texts-client"
description = "Client of the texts contract (texts.capnp): Texts and TextFeed of fs-texts-core over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fs-texts-core = { path = "../fs-texts-core" }
fs-texts = { path = "../fs-texts" }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }

[dev-dependencies]
fs-texts-server = { path = "../fs-texts-server" }
fs-texts-testserver = { path = "../fs-texts-testserver" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
