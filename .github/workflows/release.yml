name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@15935ed0d847d522fcb43d93e340ad1b14809639
    with:
      binaries: fs-texts
      cargo-package: fs-texts-bin
      ignore-binaries: fs-texts-app,fs-texts-server   # the window and the server alone; `fs-texts` holds both
      name: fs-texts
      kind: app
      app-id: net.freesynergy.Texts
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
